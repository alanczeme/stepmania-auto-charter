<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StepMania Auto-Charter — Review Matches</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .song { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  .song.auto-skipped { opacity: 0.7; background: #fafafa; }
  .song h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
  .spotify-meta { color: #555; margin-bottom: 0.75rem; }
  .candidates { display: flex; gap: 1rem; flex-wrap: wrap; }
  .candidate { flex: 1 1 260px; border: 1px solid #eee; border-radius: 6px; padding: 0.75rem; }
  .candidate img { max-width: 100%; border-radius: 4px; }
  .candidate .title { font-weight: 600; margin: 0.5rem 0 0.15rem; }
  .candidate .channel { color: #666; font-size: 0.9rem; }
  .duration-match { color: #1a7f37; font-weight: 600; }
  .duration-mismatch { color: #a15c00; }
  .skip-note { color: #a30000; font-style: italic; }
  .fields { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.5rem 0; align-items: flex-end; }
  label.field { display: flex; flex-direction: column; font-size: 0.85rem; color: #555; gap: 0.2rem; flex: 1 1 220px; }
  label.field input[type=text] { font-size: 0.95rem; padding: 0.4rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
  .origin-note { flex-basis: 100%; font-size: 0.8rem; color: #888; font-style: italic; }
  label.choice { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 0.5rem; cursor: pointer; }
  .actions { position: sticky; bottom: 0; background: white; padding: 1rem 0; border-top: 1px solid #ddd; }
  button#confirm { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  .status { margin-left: 1rem; }
  iframe { width: 100%; height: 160px; border: 0; border-radius: 4px; }
</style>
</head>
<body>
<h1>Review songs</h1>
<p>{{COUNT}} song(s) queued. Confirm or fix each title/artist below -- YouTube video titles and Spotify-sourced matches aren't always exactly right. Nothing downloads until you click Confirm &amp; Continue.</p>
<form id="review-form">
{{ROWS}}
<div class="actions">
  <button type="submit" id="confirm">Confirm &amp; Continue</button>
  <span class="status" id="status"></span>
</div>
</form>
<script>
document.getElementById('review-form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var data = {};
  document.querySelectorAll('input[type=radio]:checked').forEach(function (r) {
    data[r.name] = r.value;
  });
  document.querySelectorAll('input[type=text]').forEach(function (t) {
    data[t.name] = t.value;
  });
  var statusEl = document.getElementById('status');
  statusEl.textContent = 'Submitting...';
  fetch('/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).then(function (resp) {
    if (resp.ok) {
      statusEl.textContent = 'Submitted! You can close this tab.';
      document.getElementById('confirm').disabled = true;
    } else {
      statusEl.textContent = 'Submit failed, try again.';
    }
  }).catch(function () {
    statusEl.textContent = 'Submit failed, try again.';
  });
});
</script>
</body>
</html>
